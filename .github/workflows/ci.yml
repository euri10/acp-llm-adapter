# CI pipeline for acp-llm-adapter
#
# Enforces all checks mandated by AGENTS.md:
#   • cargo fmt --all -- --check
#   • cargo clippy --locked --all-targets --all-features -- -D warnings
#   • cargo test --locked --all-features (including doc-tests)
#   • cargo doc --locked --no-deps --all-features
#   • cargo build --locked --release --all-features
#   • cargo audit (dependency vulnerabilities)
#   • scripts/check-agent-instructions (AGENTS.md size limit)
#   • scripts/check-readme-snippets (README quotes the tested snippets)
#   • scripts/test-editor-snippets (LouiseLM and CodeCompanion snippets run)
#
# MSRV: 1.95  (stable toolchain, edition 2024)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  # Pin the exact same Rust version declared in Cargo.toml [package].rust-version
  RUST_VERSION: "1.95"

jobs:
  check:
    name: "fmt + clippy + test + doc + audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }} (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Bust the cache whenever the lock-file changes so stale metadata
          # from prior dependency versions doesn't linger.
          cache-on-failure: true

      # ------------------------------------------------------------------
      # 1. Formatting  (AGENTS.md -> docs/agent-rust.md)
      # ------------------------------------------------------------------
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # ------------------------------------------------------------------
      # 2. Linting    (AGENTS.md -> docs/agent-rust.md)
      # ------------------------------------------------------------------
      # Guard the first dependency resolver and every later Cargo gate:
      # validate the submitted lockfile instead of silently rewriting it.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Released binaries use default features; --all-features also enables
      # the draft protocol-v2 probe, so lint the shipped configuration too.
      - name: cargo clippy (default features, as released)
        run: cargo clippy --locked --all-targets -- -D warnings

      # ------------------------------------------------------------------
      # 3. Testing    (AGENTS.md -> docs/agent-testing.md)
      # ------------------------------------------------------------------
      # Plain `cargo test`, deliberately not `--all-targets`: the fixture
      # binaries in examples/ are located through the artifact cargo uplifts to
      # <profile>/examples/<name>, and --all-targets compiles examples only as
      # test targets, leaving that hash-free path absent (daa-bq9y). It is also
      # the command docs/agent-testing.md prescribes, so a green local run and a
      # green CI run now mean the same thing. Nothing is lost: there are no
      # benches, and the examples contain no #[test] to run.
      - name: cargo test
        run: cargo test --locked --all-features
        env:
          # Prevent accidental network calls in tests that would hang in CI.
          LLM_API_KEY: "skip-ci-no-key"

      - name: cargo test (doc-tests)
        run: cargo test --locked --doc --all-features

      # The shipped binary must keep answering v2 requests with v1.
      - name: cargo test (default features, protocol negotiation)
        run: cargo test --locked --test serve_protocol_v2
        env:
          LLM_API_KEY: "skip-ci-no-key"

      # ------------------------------------------------------------------
      # 4. Documentation  (AGENTS.md -> docs/agent-rust.md)
      # ------------------------------------------------------------------
      - name: cargo doc --no-deps
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # ------------------------------------------------------------------
      # 5. Release build  (catches release-profile regressions early)
      # ------------------------------------------------------------------
      - name: cargo build --release
        run: cargo build --locked --release --all-features

      # ------------------------------------------------------------------
      # 6. Security audit  (AGENTS.md -> Security)
      # ------------------------------------------------------------------
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

      # ------------------------------------------------------------------
      # 7. Agent instructions  (AGENTS.md -> Required references)
      #    Keeps the always-loaded contract small enough that detail stays in
      #    docs/agent-*.md instead of drifting back into the root file.
      # ------------------------------------------------------------------
      - name: AGENTS.md size limit
        run: ./scripts/check-agent-instructions

      # ------------------------------------------------------------------
      # 8. README snippets  (README.md -> Editor Setup)
      #    The editor configurations users copy are the files that
      #    test-editor-snippets runs; the README must quote them exactly.
      # ------------------------------------------------------------------
      - name: README snippet quotes
        run: ./scripts/check-readme-snippets

  editor-snippets:
    name: "editor snippets (LouiseLM, CodeCompanion)"
    runs-on: ubuntu-latest
    env:
      # Neovim stable from https://github.com/neovim/neovim/releases; LouiseLM
      # needs 0.12+. Bump with the plugin pins in scripts/test-editor-snippets.
      NVIM_VERSION: v0.12.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }} (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Neovim ${{ env.NVIM_VERSION }} and sqlite3
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q && sudo apt-get install -yq sqlite3

      - name: Run editor snippets against the fake provider
        run: ./scripts/test-editor-snippets
