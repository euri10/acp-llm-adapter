# Scheduled dependency audit.
#
# Deliberately separate from CI, and deliberately stricter.
#
# CI runs plain `cargo audit`, which exits 0 for the warning classes — `unsound`,
# `yanked`, `unmaintained` — and non-zero only for outright vulnerabilities. That
# is the right setting for a push gate: those warnings are generated by other
# people's crates on their own schedule, so denying them in CI would mean a
# stranger yanking a transitive dependency at 3am turns your next push red for
# reasons you did not cause and cannot fix.
#
# The cost of that leniency is silence: RUSTSEC-2026-0221 and a yanked chacha20
# sat in the tree printing to a green CI log until someone read it (daa-pb93).
#
# So this workflow decouples telling from blocking. It runs `--deny warnings` on
# a schedule, where a red run is a notification rather than an obstruction. A
# failure here means something new landed upstream; triage it into Beads and fix
# it on your own schedule.
name: Audit

on:
  schedule:
    # Daily. Offset from the hour because GitHub drops scheduled runs that pile
    # up on the hour under load.
    - cron: "17 6 * * *"
  # So the audit can be re-run on demand after a fix, without waiting a day.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95"

jobs:
  audit:
    name: "cargo audit --deny warnings"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust ${{ env.RUST_VERSION }} (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Warnings fail here and only here. Cargo.lock is the input, so this needs
      # no build — a new advisory against an unchanged tree still trips it.
      - name: cargo audit
        run: cargo audit --deny warnings
